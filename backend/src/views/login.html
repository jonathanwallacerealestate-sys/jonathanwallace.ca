<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Dashboard — Sign In</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
      display:flex;justify-content:center;align-items:center;min-height:100vh;
      background:linear-gradient(135deg,#0a1628 0%,#1a1a2e 100%);color:#f5f5f5}
    form{background:rgba(255,255,255,0.04);backdrop-filter:blur(10px);
      padding:2.5rem;border-radius:16px;border:1px solid rgba(201,169,110,0.2);
      width:90%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
    h1{margin:0 0 0.5rem;color:#c9a96e;font-size:1.5rem;letter-spacing:0.5px}
    p{color:#9ca3af;font-size:0.9rem;margin-bottom:1.5rem}
    input{width:100%;padding:14px;border:1px solid rgba(201,169,110,0.3);
      border-radius:10px;font-size:16px;background:rgba(0,0,0,0.3);
      color:#f5f5f5;margin-bottom:1rem}
    input:focus{outline:none;border-color:#c9a96e;background:rgba(0,0,0,0.5)}
    button{width:100%;padding:14px;background:#c9a96e;color:#0a1628;border:none;
      border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;
      text-transform:uppercase;letter-spacing:1px}
    button:hover{background:#d4b478}
  </style>
</head>
<body>
  <form method="GET">
    <h1>Agent Dashboard</h1>
    <p>Enter your API key to continue</p>
    <input name="key" type="password" placeholder="API key" autofocus />
    <button type="submit">Sign In</button>
  </form>
</body>
</html>
