# Wallace Desk — one Node process on Railway Hobby.
# Mount a volume at /data and set DATA_DIR=/data so the morning board survives deploys.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "node src/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
