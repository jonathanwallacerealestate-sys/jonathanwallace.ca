# Netlify Configuration for The Official Realty Group

[build]
  # Publish directory (static site root)
  publish = "."
  # No build command needed for static site
  command = ""

# Redirect rules for clean URLs
[[redirects]]
  from = "/buyers"
  to = "/buyers.html"
  status = 200

[[redirects]]
  from = "/sellers"
  to = "/sellers.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# Community redirects
[[redirects]]
  from = "/communities/midland"
  to = "/communities/midland.html"
  status = 200

[[redirects]]
  from = "/communities/penetanguishene"
  to = "/communities/penetanguishene.html"
  status = 200

[[redirects]]
  from = "/communities/tiny-township"
  to = "/communities/tiny-township.html"
  status = 200

[[redirects]]
  from = "/communities/tay-township"
  to = "/communities/tay-township.html"
  status = 200

[[redirects]]
  from = "/communities/wasaga-beach"
  to = "/communities/wasaga-beach.html"
  status = 200

# Agent Command Center — proxy to Railway backend.
# Backend service: https://jonathanwallaceca-production.up.railway.app
[[redirects]]
  from = "/dashboard"
  to = "https://jonathanwallaceca-production.up.railway.app/dashboard"
  status = 302
  force = true

[[redirects]]
  from = "/dashboard/*"
  to = "https://jonathanwallaceca-production.up.railway.app/dashboard/:splat"
  status = 302
  force = true

# API proxy so the marketing site's contact form can hit the backend
# through a same-origin path (avoids CORS issues).
[[redirects]]
  from = "/api/*"
  to = "https://jonathanwallaceca-production.up.railway.app/api/:splat"
  status = 200
  force = true

# Catch-all redirect for 404s to index
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

# Cache control headers for different file types
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
