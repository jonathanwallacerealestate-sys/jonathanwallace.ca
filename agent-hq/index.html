<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA: manifest, theme, and home-screen install hints -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0e1118" />
    <meta name="color-scheme" content="dark light" />

    <!-- iOS: home-screen install behavior -->
    <link rel="apple-touch-icon" href="/agent-hq-logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Agent HQ" />

    <title>Agent HQ — Jonathan Wallace Real Estate</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Register service worker for offline shell (PWA Sprint 1 #3) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('[SW] registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
