name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  agent-hq:
    name: agent-hq · syntax + build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: agent-hq

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agent-hq/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Server-side syntax check
        run: node --check server.js

      - name: Vite client build
        run: npm run build
